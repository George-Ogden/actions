name: Run MyPy

on:
  workflow_call:
    inputs:
      python-version:
        default: "3.15"
        required: false
        type: string
      timeout-minutes:
        type: number
        required: false
        default: 10
      mypy-flags:
        type: string
        required: false
        default: "."

jobs:
  run-mypy:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          lfs: true
          submodules: recursive

      - name: Check for Python files
        id: detect-files
        run: |
          if [ -z "$(git ls-files '*.py' '*.pyi')" ]; then
            echo 'no_files=true' >> "$GITHUB_OUTPUT"
          else
            echo 'no_files=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.detect-files.outputs.no_files == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install latest version of uv
        if: steps.detect-files.outputs.no_files == 'false'
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies
        if: steps.detect-files.outputs.no_files == 'false'
        run: |
          uv sync --group types --no-dev
          uv tool install mypy

      - name: Run MyPy
        if: steps.detect-files.outputs.no_files == 'false'
        run: |
          uv run --no-sync mypy ${{ inputs.mypy-flags }}
