name: Run Prek on All Files

on:
  push:
    branches:
      - m
  pull_request:
    branches:
      - m
  workflow_call:
    inputs:
      python-version:
        default: "3.15"
        required: false
        type: string

jobs:
  run-prek:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Load entire cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/
          key: prek

      - name: Install latest version of uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies
        run: |
          uv sync --group lint --no-dev || uv venv
          uv tool install prek
          uv pip install pyyaml --upgrade

      - name: Setup and run prek
        run: |
          SKIP=$(uv run --no-sync python - <<'EOF'
          import yaml
          with open(".pre-commit-config.yaml") as f:
              config = yaml.safe_load(f)
          print(",".join(config.get("ci", {}).get("skip", [])))
          EOF
          )
          export SKIP
          uv run --no-sync prek run -av

      - name: Print Diff on Failure
        if: failure()
        run: |
          git diff
