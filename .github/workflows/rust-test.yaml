name: Run Rust Tests

on:
  workflow_call:
    inputs:
      rust-version:
        required: true
        type: string
      timeout-minutes:
        type: number
        required: false
        default: 5
      test-flags:
        type: string
        required: false
        default: ""

jobs:
  run-cargo-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          lfs: true
          submodules: recursive

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.rust-version }}

      - name: Build with Cargo
        run: |
          cargo build --workspace --all-targets

      - name: Run Tests with Cargo
        run: |
          cargo test --workspace --all-targets --no-fail-fast ${{ inputs.test-flags }}
